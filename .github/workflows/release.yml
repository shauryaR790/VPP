name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.0.2)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM 22
        shell: pwsh
        run: |
          curl.exe -L -o llvm.exe "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe"
          Start-Process -FilePath .\llvm.exe -ArgumentList "/S","/D=C:\LLVM" -Wait
          "LLVM_SYS_221_PREFIX=C:\LLVM" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build release
        run: cargo build --release --features codegen,lsp --bin vpp --bin vppls

      - name: Stage Windows files
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v',''
          $staging = "staging"
          New-Item -ItemType Directory -Force -Path "$staging/examples" | Out-Null
          Copy-Item target/release/vpp.exe, target/release/vppls.exe $staging/
          Copy-Item -Recurse std, registry, runtime $staging/
          Copy-Item -Recurse cmake $staging/
          Copy-Item examples/hello.vpp $staging/examples/
          Copy-Item LICENSE $staging/
          New-Item -ItemType Directory -Force -Path "$staging/llvm/bin" | Out-Null
          Copy-Item C:\LLVM\bin\clang*.exe, C:\LLVM\bin\lld*.exe, C:\LLVM\bin\LLVM*.dll, C:\LLVM\bin\lib*.dll -ErrorAction SilentlyContinue $staging/llvm/bin/
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        shell: pwsh
        run: |
          curl.exe -L -o innosetup.exe "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          Start-Process -FilePath .\innosetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/DIR=C:\InnoSetup6" -Wait
          $iscc = "C:\InnoSetup6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\InnoSetup6\ISCC.exe"
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Push-Location installer
          try {
            & $iscc /DMyAppVersion="$env:VERSION" vpp-setup.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "v$env:VERSION"
          $dir = "vpp-$version-windows-x64"
          Copy-Item -Recurse staging $dir
          Copy-Item GO.bat, RELEASE.txt, START-HERE.txt $dir/
          $zip = "$dir.zip"
          Compress-Archive -Path $dir -DestinationPath $zip -Force
          Get-FileHash $zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $zip -Leaf)" } | Set-Content "$zip.sha256"
          Get-FileHash "output/vpp-$env:VERSION-setup.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  vpp-$($env:VERSION)-setup.exe" } | Set-Content "output/vpp-$env:VERSION-setup.exe.sha256"

      - name: Package VSIX
        shell: pwsh
        run: |
          npm install -g @vscode/vsce
          Push-Location editor/vscode-vpp
          try {
            $extVer = (Get-Content package.json -Raw | ConvertFrom-Json).version
            vsce package -o "../../vplusplus-$extVer.vsix"
            if (-not (Test-Path "../../vplusplus-$extVer.vsix")) { throw "vsce package failed" }
          } finally {
            Pop-Location
          }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpp-windows-x64
          if-no-files-found: error
          path: |
            output/vpp-*-setup.exe
            output/vpp-*-setup.exe.sha256
            vpp-*-windows-x64.zip
            vpp-*-windows-x64.zip.sha256
            vplusplus-*.vsix

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vpp-windows-x64
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          find artifacts -type f -exec cp {} . \;
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          files: |
            vpp-*-setup.exe
            vpp-*-setup.exe.sha256
            vpp-*-windows-x64.zip
            vpp-*-windows-x64.zip.sha256
            vplusplus-*.vsix
          body_path: RELEASE_NOTES_v1.0.5.md

  build-linux:
    runs-on: ubuntu-latest
    needs: [release]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 22
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-22 lld-22 llvm-22-dev libclang-22-dev
          echo "LLVM_SYS_221_PREFIX=$(llvm-config-22 --prefix)" >> "$GITHUB_ENV"
          echo "$(llvm-config-22 --prefix)/bin" >> "$GITHUB_PATH"

      - name: Build release
        run: cargo build --release --features codegen,lsp --bin vpp --bin vppls

      - name: Package Linux bundle
        run: |
          VERSION="${RELEASE_TAG}"
          DIR="vpp-${VERSION}-linux-x64"
          mkdir -p "$DIR/examples"
          cp target/release/vpp target/release/vppls "$DIR/"
          cp -r std registry runtime "$DIR/"
          cp examples/hello.vpp "$DIR/examples/"
          cp LICENSE RELEASE.txt run.sh "$DIR/"
          chmod +x "$DIR/run.sh" "$DIR/vpp" "$DIR/vppls"
          tar -czf "${DIR}.tar.gz" "$DIR"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"

      - name: Attach Linux bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          files: |
            vpp-*-linux-x64.tar.gz
            vpp-*-linux-x64.tar.gz.sha256

  build-macos:
    runs-on: macos-latest
    needs: [release]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 22
        run: |
          curl -L -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-macOS-ARM64.tar.xz"
          tar xf llvm.tar.xz
          echo "LLVM_SYS_221_PREFIX=$PWD/LLVM-22.1.8-macOS-ARM64" >> "$GITHUB_ENV"
          echo "$PWD/LLVM-22.1.8-macOS-ARM64/bin" >> "$GITHUB_PATH"

      - name: Build release
        run: cargo build --release --features codegen,lsp --bin vpp --bin vppls

      - name: Package macOS bundle
        run: |
          VERSION="${RELEASE_TAG}"
          DIR="vpp-${VERSION}-macos-arm64"
          mkdir -p "$DIR/examples" "$DIR/llvm/bin"
          cp target/release/vpp target/release/vppls "$DIR/"
          cp -r std registry runtime "$DIR/"
          cp examples/hello.vpp "$DIR/examples/"
          cp LICENSE RELEASE.txt run.sh "$DIR/"
          cp LLVM-22.1.8-macOS-ARM64/bin/clang LLVM-22.1.8-macOS-ARM64/bin/clang++ LLVM-22.1.8-macOS-ARM64/bin/lld \
             LLVM-22.1.8-macOS-ARM64/lib/libLLVM*.dylib "$DIR/llvm/bin/" 2>/dev/null || true
          chmod +x "$DIR/run.sh" "$DIR/vpp" "$DIR/vppls"
          tar -czf "${DIR}.tar.gz" "$DIR"
          shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"

      - name: Attach macOS bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          files: |
            vpp-*-macos-arm64.tar.gz
            vpp-*-macos-arm64.tar.gz.sha256
